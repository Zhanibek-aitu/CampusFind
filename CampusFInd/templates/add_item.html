<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item - CampusFind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page-wrapper">

    <nav class="top-nav">
        <div class="brand">
            <div class="brand-icon">➕</div>
            <div>
                <h1>Add New Item</h1>
                <p>Register a lost or found campus item</p>
            </div>
        </div>

        <div class="nav-actions">
            <button id="themeToggle" class="btn btn-light" type="button">🌙 Dark Mode</button>
            <a href="/" class="btn btn-secondary">← Back</a>
        </div>
    </nav>

    <main class="form-card">

        {% if errors %}
        <div class="error-box">
            <strong>Please fix the following errors:</strong>
            <ul>
                {% for error in errors %}
                <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <form action="/add" method="POST">

            <div class="form-group">
                <label for="name">Item Name</label>
                <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        minlength="2"
                        placeholder="e.g. MacBook Pro"
                        value="{{ name_value }}"
                >
                <small>Minimum 2 characters.</small>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="item_type">Type</label>
                    <select id="item_type" name="item_type" required>
                        <option value="">Select type</option>

                        {% if item_type_value == "lost" %}
                        <option value="lost" selected>Lost (I lost it)</option>
                        {% else %}
                        <option value="lost">Lost (I lost it)</option>
                        {% endif %}

                        {% if item_type_value == "found" %}
                        <option value="found" selected>Found (I found it)</option>
                        {% else %}
                        <option value="found">Found (I found it)</option>
                        {% endif %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>

                        {% for category in categories %}
                        {% if category_value == category %}
                        <option value="{{ category }}" selected>{{ category }}</option>
                        {% else %}
                        <option value="{{ category }}">{{ category }}</option>
                        {% endif %}
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input
                        type="text"
                        id="location"
                        name="location"
                        required
                        minlength="2"
                        placeholder="e.g. Library"
                        value="{{ location_value }}"
                >
                <small>Minimum 2 characters.</small>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                        id="description"
                        name="description"
                        rows="4"
                        required
                        minlength="3"
                        placeholder="Color, brand, distinguishing marks..."
                >{{ description_value }}</textarea>
                <small id="descriptionCounter">0 characters</small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Submit Item</button>
                <a href="/" class="btn btn-light">Cancel</a>
            </div>
        </form>
    </main>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
